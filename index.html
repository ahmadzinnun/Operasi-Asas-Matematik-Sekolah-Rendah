/* Narrow NO-BREAK space for digit grouping: "2 774 713" reads as grouped
   thousands but can never be split across two lines. */
const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, "\u202F");

/* Keep every question on ONE line. Estimating from character count was never
   reliable across faces and phone widths — AutoFitLine (below) measures the
   rendered text instead and shrinks it until it truly fits. This estimate is
   only the starting size, so the first paint is close. */
function qSize(text) {
  const chars = text.length;
  const fit = Math.floor(300 / (chars * 0.46));   // Caveat runs narrow
  return Math.max(18, Math.min(46, fit));
}

/* ---------------- question generation (fresh every attempt) --------------- */
function digitwise(a, b, op) {
  const sa = String(a).split("").reverse(), sb = String(b).split("").reverse();
  let out = [];
  for (let i = 0; i < Math.max(sa.length, sb.length); i++) {
    const x = +(sa[i] || 0), y = +(sb[i] || 0);
    out.push(op === "+" ? (x + y) % 10 : Math.abs(x - y));
  }
  return +out.reverse().join("") || 0;
}

function makeItem(year, sec, tier2) {
  const cap = CAP[year];
  const low = Math.max(10, Math.floor(cap / 100));
  if (sec === "+") {
    const b = ri(low, Math.floor(cap * 0.45));
    const a = ri(low, cap - b);
    return { sec, a, b, op: "+", ans: a + b, text: `${fmt(a)} + ${fmt(b)} =` };
  }
  if (sec === "-") {
    const a = ri(Math.floor(cap * 0.4), cap);
    const b = ri(low, a - 1);
    return { sec, a, b, op: "-", ans: a - b, text: `${fmt(a)} − ${fmt(b)} =` };
  }
  if (sec === "*" || sec === "/") {
    /* DSKP scope for the multiplier / divisor:
         Y2 — one digit and 10 only            (SP 2.4.2)
         Y3 — one digit, 10 and 100            (two-digit NOT yet introduced)
         Y4-Y6 — up to two digits              (confirmed in DSKP Y4/Y5)          */
    const n = year === 2 ? pick([2, 3, 4, 5, 10])
            : year === 3 ? (tier2 ? pick([10, 100]) : ri(2, 9))
            : (tier2 ? ri(11, 45) : ri(2, 9));
    if (sec === "*") {
      const a = ri(Math.max(2, Math.floor(low / 2)), Math.floor(cap / n));
      return { sec, a, b: n, op: "*", ans: a * n, text: `${fmt(a)} × ${fmt(n)} =` };
    }
    const qt = ri(Math.max(2, Math.floor(low / 4)), Math.floor(cap / n));
    return { sec, a: qt * n, b: n, op: "/", ans: qt, text: `${fmt(qt * n)} ÷ ${fmt(n)} =` };
  }
  if (sec === "rep") {
    const k = pick([2, 4, 5, 10]);
    const n = ri(3, k === 10 ? 5 : 6);
    return { sec, k, n, ans: k * n, text: Array(n).fill(k).join(" + ") + " =" };
  }
  // succ — subtract equal groups, stopping above or at zero
  const k = pick([2, 4, 5, 10]);
  const n = ri(3, k === 10 ? 5 : 6);
  const steps = ri(2, n - 1);
  const start = k * n;
  return { sec, k, n: steps, ans: start - k * steps,
           text: fmt(start) + " " + Array(steps).fill(`− ${k}`).join(" ") + " =" };
}

function generate(year) {
  const secs = year === 1 ? ["+", "-", "rep", "succ"] : ["+", "-", "*", "/"];
  const out = [];
  secs.forEach((s) => {
    for (let j = 0; j < 4; j++) {
      // for × and ÷ from Year 3: two 1-digit, two 2-digit
      // second tier for the last two items of × and ÷ (Year 3 and above)
      const tier2 = (s === "*" || s === "/") && year >= 3 && j >= 2;
      let it, guard = 0;
      do { it = makeItem(year, s, tier2); guard++; }
      while (guard < 40 && out.some((p) => p.text === it.text));
      out.push({ ...it, id: `${s}-${j}` });
    }
  });
  return out;
}

/* ---------------- diagnose a written answer ---------------- */
function diagnose(it, raw) {
  const clean = String(raw).replace(/[\s,]/g, "");
  if (!clean) return "blank";
  if (!/^-?\d+$/.test(clean)) return "other";
  const v = +clean;
  if (v === it.ans) return null;
  const { a, b, op, ans } = it;
  const test = [];
  if (op === "+") {
    test.push([digitwise(a, b, "+"), "add_nocarry"], [Math.abs(a - b), "add_subbed"],
              [ans - 10, "add_place"], [ans + 10, "add_place"],
              [ans - 100, "add_place"], [ans + 100, "add_place"],
              [ans - 1000, "add_place"], [ans + 1000, "add_place"]);
  } else if (op === "-") {
    test.push([digitwise(a, b, "-"), "sub_small"], [a + b, "sub_added"],
              [ans + 10, "sub_noborrow"], [ans + 100, "sub_noborrow"],
              [ans + 1000, "sub_noborrow"], [ans - 10, "sub_noborrow"]);
  } else if (op === "*") {
    if (b >= 10) test.push([a * (b % 10), "mul_ones"], [a * Math.floor(b / 10) * 10, "mul_tens"],
                           [a * Math.floor(b / 10), "mul_tens"]);
    test.push([a + b, "mul_added"], [a * (b + 1), "mul_fact"], [a * (b - 1), "mul_fact"],
              [ans * 10, "mul_zero"], [Math.floor(ans / 10), "mul_zero"]);
  } else if (op === "/") {
    test.push([ans * 10, "div_place"], [Math.floor(ans / 10), "div_place"],
              [a * b, "div_mul"], [Math.abs(a - b), "div_sub"],
              [ans + 1, "div_fact"], [ans - 1, "div_fact"], [ans + b, "div_fact"]);
  } else if (it.sec === "rep") {
    test.push([it.k * (it.n - 1), "rep_count"], [it.k * (it.n + 1), "rep_count"],
              [it.k + it.n, "rep_count"]);
  } else {
    test.push([ans + it.k, "succ_count"], [ans - it.k, "succ_count"], [it.n, "succ_count"]);
  }
  for (const [val, key] of test) if (val === v) return key;
  return "other";
}

/* Only http(s) links are rendered, so a bad paste cannot turn into a
   javascript: URL on a screen pupils use. */
function safeUrl(raw) {
  const u = String(raw || "").trim();
  if (!u) return "";
  if (/^https?:\/\//i.test(u)) return u;
  if (/^[\w-]+(\.[\w-]+)+([/?#].*)?$/.test(u)) return "https://" + u;
  return "";
}

/* ---------------- Firebase bootstrap ---------------- */
/* The compat SDK is loaded by <script> tags in the page, so `firebase` is a
   global here. Everything below degrades quietly if it failed to load —
   the app still runs, it just cannot save. */
const fbUp = () => typeof firebase !== "undefined" && !!firebase.apps;

let db = null, auth = null, authPromise = null;

function fbInit() {
  if (!fbUp() || db) return;
  try {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    auth = firebase.auth();
    db = firebase.database();
  } catch (e) { console.error("firebase init", e); }
}

/* Pupils are signed in anonymously and silently. Every write rule requires
   auth != null, which blocks anyone who merely knows the database URL. */
function authReady() {
  fbInit();
  if (!auth) return Promise.resolve(null);
  if (!authPromise) {
    authPromise = new Promise((resolve) => {
      const stop = auth.onAuthStateChanged((u) => { if (u) { stop(); resolve(u); } });
      auth.signInAnonymously().catch((e) => { console.error("auth", e); resolve(null); });
    });
  }
  return authPromise;
}

const isTeacher = () => !!(auth && auth.currentUser && auth.currentUser.uid === TEACHER_UID);

async function teacherSignIn(email, password) {
  fbInit();
  if (!auth) throw new Error("offline");
  const cred = await auth.signInWithEmailAndPassword(email.trim(), password);
  return cred.user.uid === TEACHER_UID;
}

async function teacherSignOut() {
  if (!auth) return;
  await auth.signOut();
  authPromise = null;
  await authReady();          // straight back to an anonymous pupil session
}

/* A short, stable pseudonym so the ranking can count distinct pupils
   without a name ever reaching the public data. */
function pidOf(name, school) {
  const str = norm(name) + "|" + norm(school);
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

/* ---------------- the pupil's own history ----------------
   Stays on the pupil's device. Their past results are nobody else's
   business, and keeping them local means no per-pupil account is needed. */
const LOCAL_KEY = "ujian.local.v1";
const blankLocal = () => ({ pupils: [], attempts: [] });
const memAttempts = [];

function localLoad() {
  let v = null;
  try {
    const raw = window.localStorage.getItem(LOCAL_KEY);
    v = raw ? JSON.parse(raw) : null;
  } catch (e) { v = null; }
  const out = (v && typeof v === "object")
    ? { pupils: v.pupils || [], attempts: v.attempts || [] }
    : blankLocal();
  const ids = new Set(out.attempts.map((a) => a.id));
  memAttempts.forEach((a) => { if (!ids.has(a.id)) out.attempts.push(a); });
  const names = new Set(out.pupils.map((p) => norm(p.name)));
  memAttempts.forEach((a) => {
    if (!names.has(norm(a.name))) {
      names.add(norm(a.name));
      out.pupils.push({ name: a.name, school: a.school, state: a.state });
    }
  });
  out.attempts.sort((a, b) => a.ts - b.ts);
  return out;
}

function localSave(data) {
  try {
    const trimmed = { pupils: data.pupils.slice(-40), attempts: data.attempts.slice(-300) };
    window.localStorage.setItem(LOCAL_KEY, JSON.stringify(trimmed));
    return true;
  } catch (e) { return false; }
}

/* ---------------- small helpers ---------------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const norm = (s) => String(s || "").trim().toLowerCase().replace(/\s+/g, " ");

const pointsOf = (p) => (p >= 100 ? 3 : p >= 70 ? 2 : p >= 50 ? 1 : 0);

function median(nums) {
  if (!nums.length) return 0;
  const s = [...nums].sort((a, b) => a - b), m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : Math.round((s[m - 1] + s[m]) / 2);
}

/* Malaysian school-name abbreviations stay fully capitalised; the rest of
   the name is title case. "sjk(c) chung hwa" -> "SJK(C) Chung Hwa" */
const ABBR = new Set(["SK", "SJK", "SJKC", "SJKT", "SJK(C)", "SJK(T)", "SMK", "SMJK",
  "SRJK", "SRJK(C)", "SRJK(T)", "SBP", "MRSM", "SA", "SAR", "SRA", "SABK", "SMKA",
  "SR", "SM", "SEK", "KAFA", "SEKOLAH"]);

function tidySchool(raw) {
  return String(raw || "").trim().replace(/\s+/g, " ").split(" ").map((w) => {
    const bare = w.toUpperCase();
    if (ABBR.has(bare) && bare !== "SEKOLAH") return bare;
    return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
  }).join(" ");
}

/* A soft nudge, never a block: three or more words, or a Malay patronymic,
   usually means the pupil typed their full name into the nickname box. */
const looksLikeFullName = (raw) => {
  const w = String(raw || "").trim().split(/\s+/).filter(Boolean);
  if (w.length >= 3) return true;
  return w.some((x) => ["bin", "binti", "bt", "a/l", "a/p"].includes(x.toLowerCase()));
};

const tidyName = (raw) => String(raw || "").trim().replace(/\s+/g, " ")
  .split(" ").map((w) => (w.length <= 3 && w === w.toUpperCase() && /[A-Z]/.test(w))
    ? w : w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(" ");

/* A school's state is decided by MAJORITY VOTE across all of its
   registrations, so one typo cannot move a school to another state. */
function schoolDirectory(rows) {
  const tally = new Map();
  rows.forEach((r) => {
    if (!r.school || !r.state) return;
    if (!tally.has(r.school)) tally.set(r.school, {});
    const t = tally.get(r.school);
    t[r.state] = (t[r.state] || 0) + 1;
  });
  const state = new Map(), conflicts = [];
  tally.forEach((counts, school) => {
    const ordered = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    state.set(school, ordered[0][0]);
    if (ordered.length > 1) conflicts.push({ school, main: ordered[0][0], counts: ordered });
  });
  return { state, conflicts, names: [...state.keys()].sort() };
}

function leaderboard(rows, dir, { year = 0, state = "" } = {}) {
  const use = year ? rows.filter((r) => r.year === year) : rows;
  const bySchool = new Map();
  use.forEach((r) => {
    const k = r.school || "—";
    if (!bySchool.has(k)) bySchool.set(k, []);
    bySchool.get(k).push(r);
  });
  let list = [...bySchool].map(([school, rs]) => ({
    school,
    state: dir.state.get(school) || rs[0].state || "—",
    tests: rs.length,
    pupils: new Set(rs.map((r) => r.pid || r.id)).size,
    points: rs.reduce((s, r) => s + r.points, 0),
    median: median(rs.map((r) => r.pct)),
  }));
  if (state) list = list.filter((s) => s.state === state);
  list.sort((a, b) => b.points - a.points || b.median - a.median ||
                      a.school.localeCompare(b.school));
  return list;
}

/* ---- restoring a CSV/TSV backup ----
   The export carries the ranking fields only, so an imported row has no
   per-question diagnosis. That is stated in the tutor screen rather than
   quietly filling the gap with invented data. */
function splitCells(line) {
  const out = []; let cur = "", q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) {
      if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === "," || ch === "\t") { out.push(cur); cur = ""; }
    else cur += ch;
  }
  out.push(cur);
  return out.map((c) => c.trim());
}

function parseTs(v) {
  const m = String(v).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[\s,]+(\d{1,2}):(\d{2}))?/);
  if (!m) return NaN;
  return new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0)).getTime();
}

function parseBackup(text) {
  const lines = String(text).split(/\r?\n/).filter((l) => l.trim());
  const rows = []; let skipped = 0;
  lines.forEach((line) => {
    const c = splitCells(line);
    const ts = c.length >= 9 ? parseTs(c[0]) : NaN;
    if (!ts || isNaN(ts) || !c[1]) { skipped++; return; }   // header or junk line
    const year = +c[4] || 0;
    const correct = +c[5] || 0;
    const total = +c[6] || 0;
    let pct = +c[7];
    if (!isFinite(pct)) pct = total ? Math.round((correct / total) * 100) : 0;
    let points = +c[8];
    if (!isFinite(points)) points = pointsOf(pct);
    rows.push({
      id: "csv-" + ts + "-" + norm(c[1]).replace(/\s/g, ""),
      ts, name: c[1], school: tidySchool(c[2]), state: c[3],
      year, correct, total, pct, points, sec: {}, err: {}, imported: true,
    });
  });
  return { rows, skipped };
}

const dstr = (ts) => {
  const d = new Date(ts), p = (n) => String(n).padStart(2, "0");
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()}`;
};
const dtstr = (ts) => {
  const d = new Date(ts), p = (n) => String(n).padStart(2, "0");
  return `${dstr(ts)} ${p(d.getHours())}:${p(d.getMinutes())}`;
};

/* ---------------- shared UI atoms ---------------- */
const FONTS = `
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@1,500;1,600;1,700&family=Caveat:wght@600;700&display=swap');
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
input, select, button, textarea { font-family: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid ${C.amber}; outline-offset: 2px;
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
`;

const display = "'Baloo 2', system-ui, sans-serif";
const body = "'Nunito Sans', system-ui, -apple-system, sans-serif";
/* Questions and written answers use an italic serif — numerals read as
   handwritten arithmetic rather than interface text. */
const quiz = "'Playfair Display', Georgia, 'Times New Roman', serif";
const quizStyle = { fontFamily: quiz, fontStyle: "italic", fontWeight: 600 };
/* What the pupil writes is set in a handwriting face, so their answer never
   looks like part of the printed question. */
const hand = "'Caveat', 'Segoe Print', cursive";
const handStyle = { fontFamily: hand, fontWeight: 700, fontStyle: "normal" };

function Btn({ children, onClick, tone = "ink", size = "md", full, disabled, style }) {
  const tones = {
    ink: { bg: C.ink, fg: "#fff", bd: C.ink },
    hibiscus: { bg: C.hibiscus, fg: "#fff", bd: C.hibiscus },
    leaf: { bg: C.leaf, fg: "#fff", bd: C.leaf },
    ghost: { bg: "transparent", fg: C.ink, bd: C.rule },
    quiet: { bg: "transparent", fg: C.slate, bd: "transparent" },
  }[tone];
  const pad = size === "sm" ? "8px 12px" : size === "lg" ? "16px 20px" : "12px 16px";
  return (
    <button onClick={onClick} disabled={disabled} style={{
      background: disabled ? "#e9e2d8" : tones.bg, color: disabled ? C.slate : tones.fg,
      border: `1.5px solid ${disabled ? "#e9e2d8" : tones.bd}`, borderRadius: 14,
      padding: pad, fontSize: size === "sm" ? 13 : size === "lg" ? 17 : 15,
      fontWeight: 700, width: full ? "100%" : undefined,
      cursor: disabled ? "default" : "pointer", ...style,
    }}>{children}</button>
  );
}

function Card({ children, style }) {
  return <div style={{
    background: C.card, border: `1px solid ${C.rule}`, borderRadius: 18,
    padding: 16, marginBottom: 12, ...style,
  }}>{children}</div>;
}

function Field({ label, sub, children }) {
  return (
    <label style={{ display: "block", marginBottom: 14 }}>
      <div style={{ fontSize: 13, fontWeight: 700, color: C.ink, marginBottom: 5 }}>{label}</div>
      {sub && <div style={{ fontSize: 11, color: C.slate, marginBottom: 5 }}>{sub}</div>}
      {children}
    </label>
  );
}

const inputStyle = {
  width: "100%", padding: "13px 14px", fontSize: 16, borderRadius: 12,
  border: `1.5px solid ${C.rule}`, background: "#fff", color: C.ink,
};

/* Shrinks its text until the rendered line fits the box it sits in, then
   re-checks once webfonts land (Caveat loads after first paint and is wider
   than the fallback). */
function AutoFitLine({ text, max = 46, min = 14, style }) {
  const box = useRef(null), el = useRef(null);
  useLayoutEffect(() => {
    const fit = () => {
      const b = box.current, t = el.current;
      if (!b || !t) return;
      const avail = b.clientWidth;
      if (!avail) return;
      let size = max;
      t.style.fontSize = size + "px";
      let guard = 0;
      while (t.getBoundingClientRect().width > avail && size > min && guard++ < 80) {
        size -= 1;
        t.style.fontSize = size + "px";
      }
    };
    fit();
    const raf = requestAnimationFrame(fit);
    const t1 = setTimeout(fit, 150);
    if (typeof document !== "undefined" && document.fonts && document.fonts.ready) {
      document.fonts.ready.then(fit).catch(() => {});
    }
    window.addEventListener("resize", fit);
    return () => {
      cancelAnimationFrame(raf); clearTimeout(t1);
      window.removeEventListener("resize", fit);
    };
  }, [text, max, min]);

  return (
    <div ref={box} style={{ width: "100%", overflow: "hidden", textAlign: "center" }}>
      <span ref={el} style={{
        ...style, display: "inline-block", whiteSpace: "nowrap",
        padding: "0.12em 0.06em",          // room for Caveat's swashes
      }}>{text}</span>
    </div>
  );
}

function Pill({ children, bg, fg }) {
  return <span style={{
    background: bg, color: fg, borderRadius: 999, padding: "3px 10px",
    fontSize: 11, fontWeight: 700, display: "inline-block",
  }}>{children}</span>;
}

function Shell({ children, onBack, backLabel = "Kembali" }) {
  return (
    <div style={{
      minHeight: "100vh", background: C.paper, color: C.ink, fontFamily: body,
      padding: "18px 14px 40px",
    }}>
      <style>{FONTS}</style>
      <div style={{ maxWidth: 520, margin: "0 auto" }}>
        {onBack && (
          <button onClick={onBack} style={{
            background: "none", border: "none", color: C.slate, fontSize: 14,
            fontWeight: 700, padding: "4px 0 12px", cursor: "pointer",
          }}>← {backLabel}</button>
        )}
        {children}
      </div>
    </div>
  );
}

/* ---------------- leaderboard table ---------------- */
function BoardRows({ list, limit }) {
  const shown = limit ? list.slice(0, limit) : list;
  if (!shown.length) {
    return <div style={{ color: C.slate, fontSize: 13, padding: "6px 0" }}>
      Belum ada keputusan. Sekolah pertama yang menduduki ujian akan muncul di sini.
      <div style={{ fontSize: 11, marginTop: 3 }}>
        No results yet. The first school to take the test appears here.
      </div>
    </div>;
  }
  const medal = ["🥇", "🥈", "🥉"];
  const ring = ["#e0942a", "#9aa7b2", "#b3763a"];
  return (
    <div>
      {shown.map((s, i) => (
        <div key={s.school} style={{
          display: "flex", alignItems: "flex-start", gap: 10, padding: "10px 0",
          borderTop: i ? `1px solid ${C.rule}` : "none",
        }}>
          <div style={{
            width: 32, height: 32, borderRadius: 10, flexShrink: 0,
            background: i < 3 ? "#fff" : "#eee7dd",
            border: i < 3 ? `2px solid ${ring[i]}` : "2px solid transparent",
            color: C.slate, fontFamily: display, fontWeight: 700, fontSize: i < 3 ? 17 : 14,
            display: "flex", alignItems: "center", justifyContent: "center", marginTop: 1,
          }} aria-label={`Kedudukan ${i + 1}`}>{i < 3 ? medal[i] : i + 1}</div>
          <div style={{ flex: 1, minWidth: 0 }}>
            {/* Long school names wrap onto a second line rather than being
                clipped — "SJK(C) Chung Hwa Presbyterian" must read in full. */}
            <div style={{ fontWeight: 700, fontSize: 14, lineHeight: 1.3,
                          overflowWrap: "break-word" }}>{s.school}</div>
            <div style={{ fontSize: 11, color: C.slate, marginTop: 2 }}>
              {s.state} · {s.tests} ujian/tests · {s.pupils} murid/pupils
            </div>
          </div>
          <div style={{ textAlign: "right", flexShrink: 0 }}>
            <div style={{ fontFamily: display, fontWeight: 700, fontSize: 18, color: C.leaf }}>
              {s.points}
            </div>
            <div style={{ fontSize: 10, color: C.slate }}>mata · {s.median}%</div>
          </div>
        </div>
      ))}
    </div>
  );
}

/* ================================ APP ================================== */
function App() {
  const [screen, setScreen] = useState("home");
  const [cfg, setCfg] = useState(DEFAULT_CFG);
  const [rows, setRows] = useState([]);
  const [local, setLocal] = useState(blankLocal());
  const [ready, setReady] = useState(false);

  const [year, setYear] = useState(null);
  const [pupil, setPupil] = useState({ name: "", school: "", state: "" });
  const [items, setItems] = useState([]);
  const [answers, setAnswers] = useState({});
  const [idx, setIdx] = useState(0);
  const [result, setResult] = useState(null);
  const [saveNote, setSaveNote] = useState("");

  const [ideas, setIdeas] = useState([]);
  const [taps, setTaps] = useState(0);
  const [tutorOK, setTutorOK] = useState(false);

  /* Back navigation: screens opened from more than one place (kedudukan,
     keputusan lampau) remember where they were opened from. */
  const [stack, setStack] = useState([]);
  const scrollMem = useRef({});
  const pending = useRef(0);
  const scrollNow = () =>
    (typeof window === "undefined" ? 0
      : window.scrollY || document.documentElement.scrollTop || 0);

  const go = (next) => {
    scrollMem.current[screen] = scrollNow();
    pending.current = 0;
    setStack([...stack, screen]); setScreen(next);
  };
  /* Coming back lands the pupil exactly where they left off — the report is
     long, and returning to its top would mean scrolling it all again. */
  const goBack = (fallback = "home") => {
    const prev = stack[stack.length - 1] || fallback;
    pending.current = scrollMem.current[prev] || 0;
    setStack(stack.slice(0, -1));
    setScreen(prev);
  };
  const goRoot = (next) => { pending.current = 0; setStack([]); setScreen(next); };
  const prevScreen = stack[stack.length - 1] || "";

  useEffect(() => {
    const y = pending.current;
    const put = () => window.scrollTo(0, y);
    put();
    const raf = requestAnimationFrame(put);
    const t = setTimeout(put, 80);   // after webfonts settle the layout
    return () => { cancelAnimationFrame(raf); clearTimeout(t); };
  }, [screen]);

  const dir = useMemo(() => schoolDirectory(rows), [rows]);

  useEffect(() => {
    (async () => {
      const [c, r] = await Promise.all([cfgLoad(), rowsLoad()]);
      const l = localLoad();
      setCfg(c); setRows(r); setLocal(l);
      const last = l.pupils[l.pupils.length - 1];
      if (last) setPupil(last);
      setReady(true);
    })();
  }, []);

  const refreshRows = async () => setRows(await rowsLoad());
  const refreshIdeas = async () => setIdeas(await ideasLoad());   // teacher only

  /* ---- flow ---- */
  const startYear = (y) => { pending.current = 0; setYear(y); setStack([]); setScreen("reg"); };

  const beginTest = () => {
    setItems(generate(year));
    setAnswers({}); setIdx(0); setResult(null); setSaveNote("");
    pending.current = 0; setStack([]); setScreen("test");
  };

  const finish = async () => {
    const marks = items.map((it) => {
      const raw = answers[it.id] || "";
      return { it, raw, err: diagnose(it, raw) };
    });
    const correct = marks.filter((m) => !m.err).length;
    const pct = Math.round((correct / items.length) * 100);

    const sec = {};
    marks.forEach((m) => {
      const k = m.it.sec;
      if (!sec[k]) sec[k] = { c: 0, n: 0 };
      sec[k].n += 1;
      if (!m.err) sec[k].c += 1;
    });
    const err = {};
    marks.forEach((m) => { if (m.err) err[m.err] = (err[m.err] || 0) + 1; });

    const row = {
      id: uid(), ts: Date.now(),
      name: pupil.name, school: pupil.school, state: pupil.state,
      year, correct, total: items.length, pct, points: pointsOf(pct), sec, err,
      pid: pidOf(pupil.name, pupil.school),
    };

    setResult({ row, marks });
    pending.current = 0; setScreen("report");

    /* The pupil's own history is written FIRST and to private storage. The
       shared record raises the "Access shared data" prompt, and awaiting it
       first meant a denied or ignored prompt swallowed the history too. */
    memAttempts.push(row);
    const pupils = local.pupils.filter((p) => norm(p.name) !== norm(pupil.name));
    pupils.push({ name: pupil.name, school: pupil.school, state: pupil.state });
    const next = { pupils, attempts: [...local.attempts, row] };
    setLocal(next);
    const localOK = localSave(next);
    setSaveNote(localOK
      ? "Keputusan disimpan pada peranti ini. / Saved on this device."
      : "Keputusan disimpan untuk sesi ini sahaja. / Kept for this session only.");

    const sharedOK = await rowsAdd(row);
    setRows(await rowsLoad());
    setSaveNote((localOK
      ? "Keputusan disimpan pada peranti ini. / Saved on this device."
      : "Keputusan disimpan untuk sesi ini sahaja — tangkap layar laporan ini. / Kept for this session only — screenshot this report.")
      + (sharedOK
        ? " Rekod dihantar. / Result submitted."
        : " Rekod belum dihantar — sambungan gagal. / Not submitted — connection failed."));
  };

  const titleTap = () => {
    const n = taps + 1;
    setTaps(n);
    if (n >= 5) { setTaps(0); setScreen("gate"); }
  };

  if (!ready) {
    return <Shell><div style={{ color: C.slate, padding: 40, textAlign: "center" }}>Memuatkan…</div></Shell>;
  }

  const props = {
    cfg, setCfg, rows, setRows, refreshRows, local, setLocal, dir,
    year, setYear, pupil, setPupil, items, answers, setAnswers, idx, setIdx,
    result, saveNote, screen, setScreen, startYear, beginTest, finish,
    titleTap, tutorOK, setTutorOK, go, goBack, goRoot, prevScreen,
    ideas, setIdeas, refreshIdeas,
  };

  if (screen === "home") return <Home {...props} />;
  if (screen === "reg") return <Register {...props} />;
  if (screen === "test") return <Test {...props} />;
  if (screen === "report") return <Report {...props} />;
  if (screen === "hist") return <History {...props} />;
  if (screen === "board") return <Board {...props} />;
  if (screen === "ideas") return <Ideas {...props} />;
  if (screen === "gate") return <Gate {...props} />;
  if (screen === "tutor") return <Tutor {...props} />;
  return <Home {...props} />;
}

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
        {[1, 2, 3, 4, 5, 6].map((y) => (
          <button key={y} onClick={() => startYear(y)} style={{

            </div>

            <div style={{ fontSize: 11, color: C.slate, marginTop: 6 }}>16 soalan / questions</div>
          </button>
        ))}
      </div>

      {links.length > 0 && (
        <Card>
          <div style={{ fontFamily: display, fontSize: 18, fontWeight: 700 }}>Pautan</div>
          <div style={{ fontSize: 11, color: C.slate, marginBottom: 10 }}>Links</div>
          <div style={{ display: "grid", gap: 8 }}>
            {links.map((l, i) => (
              <a key={i} href={l.url} target="_blank" rel="noreferrer" style={{
                display: "flex", alignItems: "center", justifyContent: "space-between",

                border: `1.5px solid ${C.rule}`, background: "#fff",

                  {l.label}

/* ---------------- registration ---------------- */
function Register({ pupil, setPupil, year, dir, local, beginTest, setScreen }) {
  const [touchedState, setTouchedState] = useState(false);
  const [q, setQ] = useState("");
  const [focus, setFocus] = useState(false);

  const suggestions = useMemo(() => {
    const t = norm(q);
    if (t.length < 2) return [];
    return dir.names.filter((n) => norm(n).includes(t)).slice(0, 5);
  }, [q, dir]);

  const setSchool = (raw) => {
    setQ(raw);
    const tidy = tidySchool(raw);
    const known = dir.state.get(tidy);
    setPupil((p) => ({
      ...p, school: tidy,
      state: !touchedState && known ? known : p.state,
    }));
  };

  const chooseSuggestion = (name) => {
    setQ(name); setFocus(false); setTouchedState(false);
    setPupil((p) => ({ ...p, school: name, state: dir.state.get(name) || p.state }));
  };

  const usePupil = (p) => { setPupil(p); setQ(p.school); setTouchedState(true); };
  const clearPupil = () => { setPupil({ name: "", school: "", state: "" }); setQ(""); setTouchedState(false); };

  const ok = pupil.name.trim().length >= 2 && pupil.school.trim().length >= 2 && pupil.state;

  return (
    <Shell onBack={() => setScreen("home")} backLabel="Kembali / Back">
      <div style={{ fontFamily: display, fontSize: 26, fontWeight: 700 }}>
        Tahun {year} <span style={{ color: C.slate, fontSize: 18 }}>/ Year {year}</span>
      </div>
      <div style={{ color: C.slate, fontSize: 13, marginBottom: 16 }}>
        {TITLES[year].ms}
        <div style={{ fontSize: 12 }}>{TITLES[year].en}</div>
      </div>

      {local.pupils.length > 0 && (
        <Card style={{ background: "#fffdf8" }}>
          <div style={{ fontSize: 12, fontWeight: 700 }}>Murid pada peranti ini</div>
          <div style={{ fontSize: 11, color: C.slate, marginBottom: 8 }}>Pupils on this device</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {local.pupils.slice().reverse().map((p) => (
              <button key={p.name} onClick={() => usePupil(p)} style={{
                background: norm(p.name) === norm(pupil.name) ? C.ink : "#fff",
                color: norm(p.name) === norm(pupil.name) ? "#fff" : C.ink,
                border: `1.5px solid ${C.rule}`, borderRadius: 999,
                padding: "7px 13px", fontSize: 13, fontWeight: 700, cursor: "pointer",
              }}>{p.name}</button>
            ))}
            <button onClick={clearPupil} style={{
              background: "none", border: `1.5px dashed ${C.rule}`, borderRadius: 999,
              padding: "7px 13px", fontSize: 13, color: C.slate, cursor: "pointer",
            }}>+ Tukar murid / Change pupil</button>
          </div>
        </Card>
      )}

      <Card>
        <Field label="Nama panggilan / Nickname"
          sub="Nama penuh TIDAK diperlukan. Gunakan nama panggilan yang sama setiap kali supaya kemajuan anda terkumpul. / No full name needed. Use the same nickname each time so your progress adds up.">
          <input value={pupil.name} style={inputStyle} placeholder="cth / e.g. Yusuf"
            onChange={(e) => setPupil((p) => ({ ...p, name: e.target.value }))}
            onBlur={(e) => setPupil((p) => ({ ...p, name: tidyName(e.target.value) }))} />
          {looksLikeFullName(pupil.name) && (
            <div style={{ fontSize: 11, color: C.amber, marginTop: 6, lineHeight: 1.5 }}>
              Itu kelihatan seperti nama penuh — nama panggilan sudah memadai.
              <div>That looks like a full name — a nickname is enough.</div>
            </div>
          )}
        </Field>

        <Field label="Sekolah / School"
          sub="Taip nama sekolah; cadangan akan muncul. / Start typing — suggestions appear.">
          <input value={q || pupil.school} style={inputStyle} placeholder="cth / e.g. SK Pauh Jaya"
            onChange={(e) => setSchool(e.target.value)}
            onFocus={() => setFocus(true)} />
          {focus && suggestions.length > 0 && (
            <div style={{
              border: `1px solid ${C.rule}`, borderRadius: 12, marginTop: 6, overflow: "hidden",
            }}>
              {suggestions.map((s, i) => (
                <button key={s} onClick={() => chooseSuggestion(s)} style={{
                  display: "block", width: "100%", textAlign: "left", background: "#fff",
                  border: "none", borderTop: i ? `1px solid ${C.rule}` : "none",
                  padding: "11px 13px", fontSize: 14, cursor: "pointer", color: C.ink,
                }}>
                  {s}<span style={{ color: C.slate, fontSize: 11 }}> · {dir.state.get(s)}</span>
                </button>
              ))}
            </div>
          )}
        </Field>

        <Field label="Negeri / State"
          sub="Diisi automatik jika sekolah sudah dikenali. / Filled in automatically for known schools.">
          <select value={pupil.state} style={inputStyle}
            onChange={(e) => { setTouchedState(true); setPupil((p) => ({ ...p, state: e.target.value })); }}>
            <option value="">— Pilih negeri / Choose state —</option>
            {STATES.map((s) => <option key={s} value={s}>{s}</option>)}
          </select>
        </Field>

        <Btn full size="lg" tone="hibiscus" disabled={!ok} onClick={beginTest}>
          Mula ujian / Start test
        </Btn>
        {!ok && <div style={{ fontSize: 11, color: C.slate, marginTop: 8, textAlign: "center" }}>
          Isi nama, sekolah dan negeri untuk mula.
          <div>Fill in name, school and state to begin.</div>
        </div>}
      </Card>
    </Shell>
  );
}

/* ---------------- the test ---------------- */
function Test({ items, answers, setAnswers, idx, setIdx, finish, setScreen, year }) {
  const ref = useRef(null);
  useEffect(() => { if (ref.current) ref.current.focus(); }, [idx]);

  const it = items[idx];
  const last = idx === items.length - 1;
  const val = answers[it.id] || "";
  const done = items.filter((q) => (answers[q.id] || "").trim()).length;

  const setVal = (v) => setAnswers((a) => ({ ...a, [it.id]: v.replace(/[^\d-]/g, "") }));
  const next = () => (last ? finish() : setIdx(idx + 1));

  return (
    <Shell onBack={() => setScreen("reg")} backLabel="Batal ujian / Cancel test">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: C.slate, letterSpacing: .5 }}>
          TAHUN {year} · SOALAN {idx + 1}/{items.length}
        </div>
        <Pill bg={C.hibiscusSoft} fg={C.hibiscus}>
          {SECTIONS[it.sec].ms} / {SECTIONS[it.sec].en}
        </Pill>
      </div>
      <div style={{ height: 6, background: "#eee7dd", borderRadius: 99, margin: "8px 0 20px" }}>
        <div style={{
          width: `${(done / items.length) * 100}%`, height: "100%",
          background: C.leaf, borderRadius: 99, transition: "width .25s",
        }} />
      </div>

      <Card style={{ padding: "28px 16px", textAlign: "center" }}>
        <AutoFitLine text={it.text} max={qSize(it.text)} min={16}
          style={{ ...handStyle, color: C.ink, lineHeight: 1.3 }} />
        <div style={{
          fontSize: 11, fontWeight: 700, letterSpacing: 1, color: C.slate,
          margin: "20px 0 8px",
        }}>TULIS JAWAPAN / WRITE YOUR ANSWER</div>
        <input ref={ref} value={val} inputMode="numeric" pattern="[0-9]*"
          onChange={(e) => setVal(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") next(); }}
          placeholder="?"
          style={{
            ...inputStyle, ...handStyle, textAlign: "center", color: C.hibiscus,
            fontSize: 40, lineHeight: 1.1, padding: "10px 10px",
          }} />
      </Card>

      <div style={{ display: "flex", gap: 10, alignItems: "stretch" }}>
        <Btn tone="ghost" onClick={() => setIdx(Math.max(0, idx - 1))} disabled={idx === 0}
          style={{ flexShrink: 0, lineHeight: 1.2 }}>
          Kembali<div style={{ fontSize: 11, fontWeight: 600, opacity: .7 }}>Back</div>
        </Btn>
        <Btn tone={last ? "leaf" : "hibiscus"} full size="lg" onClick={next}
          style={{ lineHeight: 1.2 }}>
          {last ? "Hantar" : "Seterusnya"}
          <div style={{ fontSize: 12, fontWeight: 600, opacity: .85 }}>
            {last ? "Submit" : "Next"}
          </div>
        </Btn>
      </div>
      <div style={{ fontSize: 12, color: C.slate, textAlign: "center", marginTop: 10, lineHeight: 1.5 }}>
        Soalan boleh dilangkau dan dijawab kemudian.
        <div>Questions may be skipped and answered later.</div>
      </div>
    </Shell>
  );
}

/* ---------------- pupil history ---------------- */
function History({ pupil, local, setLocal, goBack, prevScreen }) {
  const [data, setData] = useState(local);
  useEffect(() => { const l = localLoad(); setData(l); setLocal(l); }, [setLocal]);

  const mine = useMemo(
    () => data.attempts.filter((a) => norm(a.name) === norm(pupil.name)).sort((a, b) => b.ts - a.ts),
    [data, pupil.name]
  );

  const others = useMemo(
    () => [...new Set(data.attempts.map((a) => a.name))]
      .filter((n) => norm(n) !== norm(pupil.name)),
    [data, pupil.name]
  );

  const secProgress = useMemo(() => {
    const chrono = [...mine].reverse();
    const keys = [...new Set(chrono.flatMap((a) => Object.keys(a.sec)))];
    return keys.map((k) => ({
      key: k,
      series: chrono.filter((a) => a.sec[k]).map((a) => Math.round((a.sec[k].c / a.sec[k].n) * 100)),
    }));
  }, [mine]);

  return (
    <Shell onBack={() => goBack("home")}
      backLabel={prevScreen === "report" ? "Kembali ke laporan / Back to report" : "Kembali / Back"}>
      <div style={{ fontFamily: display, fontSize: 26, fontWeight: 700, lineHeight: 1.1 }}>
        Keputusan lampau
      </div>
      <div style={{ fontFamily: display, fontSize: 16, color: C.slate }}>Past results</div>
      <div style={{ color: C.slate, fontSize: 12, margin: "8px 0 14px", lineHeight: 1.5 }}>
        Keputusan {pupil.name || "murid ini"} sahaja. Keputusan dipadankan dengan nama panggilan —
        gunakan ejaan yang sama setiap kali.
        <div>Only this pupil's results. Results are matched by nickname — keep the spelling the same.</div>
      </div>

      {!mine.length && (
        <Card><div style={{ fontSize: 13, color: C.slate, lineHeight: 1.5 }}>
          Belum ada keputusan tersimpan untuk nama ini. Selesaikan satu ujian untuk mula merekod kemajuan.
          <div style={{ fontSize: 12 }}>
            No saved results for this name yet. Finish a test to start tracking progress.
          </div>
          {others.length > 0 && (
            <div style={{ marginTop: 10, color: C.ink }}>
              Nama lain pada peranti ini: {others.join(", ")}. Daftar dengan ejaan yang sama untuk
              melihat keputusan tersebut.
              <div style={{ fontSize: 12, color: C.slate }}>
                Other names on this device: {others.join(", ")}. Register with the same spelling to see those.
              </div>
            </div>
          )}
          <div style={{ marginTop: 10, fontSize: 12 }}>
            Keputusan lampau disimpan pada peranti ini sahaja, bukan di pelayan.
            <div>Past results are kept on this device only, not on the server.</div>
          </div>
        </div></Card>
      )}

      {secProgress.some((s) => s.series.length > 1) && (
        <Card>
          <div style={{ fontFamily: display, fontSize: 18, fontWeight: 700 }}>Kemajuan setiap operasi</div>
          <div style={{ fontSize: 11, color: C.slate, marginBottom: 6 }}>Progress by operation</div>
          {secProgress.map((s) => (
            <div key={s.key} style={{ padding: "8px 0", borderTop: `1px solid ${C.rule}` }}>
              <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 4 }}>
                {SECTIONS[s.key].ms} <span style={{ color: C.slate, fontWeight: 400 }}>/ {SECTIONS[s.key].en}</span>
              </div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center" }}>
                {s.series.map((p, i) => (
                  <React.Fragment key={i}>
                    {i > 0 && <span style={{ color: C.slate, fontSize: 11 }}>→</span>}
                    <Pill bg={bandOf(p).bg} fg={bandOf(p).fg}>{p}%</Pill>
                  </React.Fragment>
                ))}
              </div>
            </div>
          ))}
        </Card>
      )}

      {mine.map((a) => {
        const b = bandOf(a.pct);
        return (
          <Card key={a.id} style={{ padding: 14 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 700, fontSize: 14 }}>Tahun {a.year} / Year {a.year}</div>
                <div style={{ fontSize: 11, color: C.slate }}>{dtstr(a.ts)} · {a.school}</div>
              </div>
              <div style={{ ...quizStyle, fontSize: 24, fontWeight: 700, color: b.fg }}>{a.pct}%</div>
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 10 }}>
              {Object.entries(a.sec).map(([k, s]) => (
                <Pill key={k} bg="#f3efe7" fg={C.ink}>{SECTIONS[k].ms} {s.c}/{s.n}</Pill>
              ))}
            </div>
          </Card>
        );
      })}
    </Shell>
  );
}

/* ---------------- suggestion box ---------------- */
function Ideas({ pupil, goBack, refreshIdeas }) {
  const [text, setText] = useState("");
  const [who, setWho] = useState(pupil.name || "");
  const [sent, setSent] = useState(false);
  const [busy, setBusy] = useState(false);
  const [note, setNote] = useState("");

  const send = async () => {
    const body = text.trim().slice(0, IDEA_CHARS);
    if (!body) return;
    setBusy(true);
    const ok = await ideasAdd({
      id: uid(), ts: Date.now(), text: body,
      who: who.trim().slice(0, 40), school: pupil.school || "", year: pupil.year || 0,
    });
    await refreshIdeas();
    setBusy(false); setSent(true);
    setNote(ok ? "" : "Cadangan disimpan untuk sesi ini sahaja. / Kept for this session only.");
  };

  if (sent) {
    return (
      <Shell onBack={() => goBack("home")} backLabel="Kembali / Back">
        <Card style={{ textAlign: "center", background: C.leafSoft, borderColor: C.leafSoft }}>
          <div style={{ fontFamily: display, fontSize: 22, fontWeight: 700, color: C.leaf }}>
            Terima kasih!
          </div>
          <div style={{ fontSize: 13, color: C.ink, marginTop: 4 }}>
            Cadangan anda telah dihantar kepada cikgu.
            <div style={{ color: C.slate }}>Your suggestion has been sent to the teacher.</div>
          </div>
        </Card>
        {note && <div style={{ fontSize: 11, color: C.slate, textAlign: "center", marginBottom: 12 }}>
          {note}
        </div>}
        <div style={{ display: "grid", gap: 8 }}>
          <Btn full tone="ghost" onClick={() => { setText(""); setSent(false); }}>
            Hantar satu lagi / Send another
          </Btn>
          <Btn full tone="quiet" onClick={() => goBack("home")}>Kembali / Back</Btn>
        </div>
      </Shell>
    );
  }

  return (
    <Shell onBack={() => goBack("home")} backLabel="Kembali / Back">
      <div style={{ fontFamily: display, fontSize: 26, fontWeight: 700, lineHeight: 1.1 }}>
        Kotak Cadangan
      </div>
      <div style={{ fontFamily: display, fontSize: 16, color: C.slate }}>Suggestion Box</div>
      <div style={{ color: C.slate, fontSize: 12, margin: "8px 0 14px", lineHeight: 1.5 }}>
        Apa yang anda suka, apa yang susah, apa yang patut ditambah?
        <div>What did you like, what was hard, what should be added?</div>
      </div>

      <Card>
        <Field label="Cadangan anda / Your suggestion">
          <textarea rows={6} value={text} maxLength={IDEA_CHARS}
            placeholder="Contoh: Soalan Tahun 4 terlalu senang… / e.g. The Year 4 questions are too easy…"
            onChange={(e) => setText(e.target.value)}
            style={{ ...inputStyle, lineHeight: 1.5, fontSize: 15 }} />
          <div style={{ fontSize: 11, color: C.slate, textAlign: "right", marginTop: 4 }}>
            {text.length} / {IDEA_CHARS}
          </div>
        </Field>

        <Field label="Nama panggilan (pilihan) / Nickname (optional)"
          sub="Kosongkan untuk menghantar tanpa nama. / Leave empty to send without a name.">
          <input value={who} style={inputStyle} placeholder="cth / e.g. Yusuf"
            onChange={(e) => setWho(e.target.value)} />
        </Field>

        <Btn full size="lg" tone="hibiscus" disabled={!text.trim() || busy} onClick={send}>
          {busy ? "Menghantar… / Sending…" : "Hantar cadangan / Send suggestion"}
        </Btn>

        <div style={{ fontSize: 11, color: C.slate, marginTop: 10, lineHeight: 1.5 }}>
          Jangan tulis nombor telefon, alamat atau butiran peribadi. Cadangan dibaca oleh cikgu.
          <div>Do not write phone numbers, addresses or personal details. The teacher reads these.</div>
        </div>
      </Card>
    </Shell>
  );
}

/* ---------------- tutor gate ---------------- */
function Gate({ setScreen, setTutorOK }) {
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setBusy(true); setErr("");
    try {
      const ok = await teacherSignIn(email, pw);
      if (ok) { setTutorOK(true); setScreen("tutor"); }
      else { setErr("Akaun ini bukan akaun guru. / That is not the teacher account."); }
    } catch (e) {
      setErr(e && e.code === "auth/network-request-failed"
        ? "Tiada sambungan. / No connection."
        : "E-mel atau kata laluan salah. / Wrong email or password.");
    }
    setBusy(false);
  };

  return (
    <Shell onBack={() => setScreen("home")} backLabel="Kembali / Back">
      <div style={{ fontFamily: display, fontSize: 26, fontWeight: 700, lineHeight: 1.1 }}>Skrin Guru</div>
      <div style={{ fontFamily: display, fontSize: 16, color: C.slate, marginBottom: 14 }}>
        Teacher Screen
      </div>
      <Card>
        <Field label="E-mel / Email">
          <input type="email" value={email} style={inputStyle} autoFocus inputMode="email"
            autoComplete="username"
            onChange={(e) => { setEmail(e.target.value); setErr(""); }} />
        </Field>
        <Field label="Kata laluan / Password">
          <input type="password" value={pw} style={inputStyle} autoComplete="current-password"
            onChange={(e) => { setPw(e.target.value); setErr(""); }}
            onKeyDown={(e) => { if (e.key === "Enter") submit(); }} />
        </Field>
        {err && <div style={{ color: C.hibiscus, fontSize: 12, marginBottom: 10, lineHeight: 1.5 }}>
          {err}
        </div>}
        <Btn full tone="ink" disabled={busy || !email.trim() || !pw} onClick={submit}>
          {busy ? "Log masuk… / Signing in…" : "Log masuk / Sign in"}
        </Btn>
        <div style={{ fontSize: 11, color: C.slate, marginTop: 10, lineHeight: 1.5 }}>
          Rekod murid hanya boleh dibaca oleh akaun guru ini.
          <div>Pupil records can only be read by this teacher account.</div>
        </div>
      </Card>
    </Shell>
  );
}

/* ---------------- tutor dashboard ---------------- */
function Tutor({ cfg, setCfg, rows, setRows, refreshRows, dir, setScreen,
                 ideas, setIdeas, refreshIdeas }) {
  const [tab, setTab] = useState("rekod");
  const [note, setNote] = useState("");
  const [draft, setDraft] = useState(cfg);
  const [confirmAll, setConfirmAll] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [imp, setImp] = useState("");
  const [impInfo, setImpInfo] = useState(null);

  /* The teacher reads the FULL rows (with nicknames) from /records — pupils
     only ever see /public/scores, which carries no names at all. */
  const [recs, setRecs] = useState([]);
  const [loadErr, setLoadErr] = useState("");
  const pullRecords = async () => {
    try { setRecs(await recordsLoad()); setLoadErr(""); }
    catch (e) { setLoadErr("Tidak dapat membaca rekod. / Could not read records."); }
  };
  useEffect(() => { pullRecords(); refreshIdeas(); }, []);

  const sorted = useMemo(() => [...recs].sort((a, b) => b.ts - a.ts), [recs]);

  const columns = ["Tarikh", "Nama", "Sekolah", "Negeri", "Tahun", "Betul", "Jumlah", "Peratus", "Mata"];
  const table = useMemo(() => {
    const head = columns.join("\t");
    const lines = sorted.map((r) => [dtstr(r.ts), r.name, r.school, r.state, r.year,
      r.correct, r.total, r.pct, r.points].join("\t"));
    return [head, ...lines].join("\n");
  }, [sorted]);

  const copyTSV = async () => {
    try {
      await navigator.clipboard.writeText(table);
      setNote("Disalin. Tampal terus ke Google Sheets. / Copied. Paste straight into Google Sheets.");
    } catch (e) {
      setNote("Salinan automatik disekat — salin dari kotak di bawah. / Automatic copying is blocked — copy from the box below.");
    }
  };

  const downloadCSV = () => {
    const esc = (v) => `"${String(v).replace(/"/g, '""')}"`;
    const csv = [columns.map(esc).join(","),
      ...sorted.map((r) => [dtstr(r.ts), r.name, r.school, r.state, r.year,
        r.correct, r.total, r.pct, r.points].map(esc).join(","))].join("\n");
    const url = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" }));
    const a = document.createElement("a");
    a.href = url; a.download = "keputusan-ujian.csv"; a.click();
    URL.revokeObjectURL(url);
  };

  const removeRows = async (keep) => {
    const gone = recs.filter((r) => !keep(r)).map((r) => r.id);
    if (!gone.length) return;
    const ok = await rowsRemove(gone);
    memRows.length = 0;
    await pullRecords();
    setRows(await rowsLoad());
    setNote(ok ? `${gone.length} rekod dipadam. / ${gone.length} records deleted.`
               : "Gagal memadam. / Delete failed.");
  };

  const saveCfg = async () => {
    const ok = await cfgSave(draft);
    setCfg(draft);
    setNote(ok ? "Tetapan disimpan. / Settings saved."
               : "Tetapan untuk sesi ini sahaja — storan tidak tersedia. / Applied for this session only — storage unavailable.");
  };

  const tabs = [["rekod", "Rekod"], ["sekolah", "Sekolah"],
                ["idea", `Cadangan${ideas.length ? " (" + ideas.length + ")" : ""}`],
                ["tetapan", "Tetapan"]];

  const removeIdea = async (id) => {
    const ok = await ideasRemove(id);
    memIdeas.length = 0;
    await refreshIdeas();
    setNote(ok ? "Cadangan dipadam. / Suggestion deleted."
               : "Gagal memadam. / Delete failed.");
  };

  return (
    <Shell onBack={() => setScreen("home")} backLabel="Kembali / Back">
      <div style={{ fontFamily: display, fontSize: 26, fontWeight: 700, lineHeight: 1.1 }}>Skrin Guru</div>
      <div style={{ fontFamily: display, fontSize: 16, color: C.slate }}>Teacher Screen</div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center",
                    gap: 10, margin: "6px 0 12px" }}>
        <div style={{ color: C.slate, fontSize: 13 }}>
          {recs.length} rekod/records · {dir.names.length} sekolah/schools
        </div>
        <button onClick={async () => { await teacherSignOut(); setScreen("home"); }} style={{
          background: "none", border: "none", color: C.hibiscus, fontSize: 12,
          fontWeight: 700, cursor: "pointer", flexShrink: 0,
        }}>Log keluar / Sign out</button>
      </div>
      {/* Build marker — teacher screen only, never shown to pupils. Open this
          screen on a published link to confirm which build is live. */}
      <div style={{
        display: "inline-block", background: "#eee7dd", color: C.slate,
        borderRadius: 999, padding: "4px 11px", fontSize: 11, fontWeight: 700,
        marginBottom: 12, letterSpacing: .5,
      }}>Versi / Build: REV {REV}</div>

      <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
        {tabs.map(([k, label]) => (
          <button key={k} onClick={() => { setTab(k); setNote(""); }} style={{
            flex: 1, background: tab === k ? C.ink : "#fff", color: tab === k ? "#fff" : C.ink,
            border: `1.5px solid ${C.rule}`, borderRadius: 12, padding: "9px 2px",
            fontSize: 11, fontWeight: 700, cursor: "pointer",
          }}>{label}</button>
        ))}
      </div>

      {note && <div style={{
        background: C.leafSoft, color: C.leaf, borderRadius: 12, padding: "10px 12px",
        fontSize: 12, fontWeight: 700, marginBottom: 12, lineHeight: 1.5,
      }}>{note}</div>}

      {tab === "rekod" && (
        <>
          <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
            <Btn size="sm" tone="ghost" onClick={copyTSV}>Salin / Copy</Btn>
            <Btn size="sm" tone="ghost" onClick={downloadCSV}>CSV</Btn>
            <Btn size="sm" tone="quiet" onClick={async () => { await pullRecords(); refreshRows(); }}>
              Muat semula / Refresh
            </Btn>
          </div>

          {loadErr && <Card style={{ background: C.hibiscusSoft, borderColor: C.hibiscusSoft }}>
            <div style={{ fontSize: 12, color: C.hibiscus, fontWeight: 700 }}>{loadErr}</div>
          </Card>}

          {/* Manual copy sits at the TOP — the record list below grows long. */}
          {sorted.length > 0 && (
            <Card>
              <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 6 }}>
                Salin manual / Manual copy (TSV)
              </div>
              <textarea readOnly value={table} rows={5} style={{
                ...inputStyle, fontSize: 11, fontFamily: "ui-monospace, monospace",
              }} />
            </Card>
          )}

          <Card>
            <button onClick={() => { setShowImport(!showImport); setImpInfo(null); }} style={{
              display: "flex", justifyContent: "space-between", alignItems: "center",
              width: "100%", background: "none", border: "none", padding: 0, cursor: "pointer",
            }}>
              <span style={{ textAlign: "left" }}>
                <span style={{ fontSize: 13, fontWeight: 700, color: C.ink, display: "block" }}>
                  ⬆ Pulihkan daripada CSV
                </span>
                <span style={{ fontSize: 11, color: C.slate }}>Restore records from a CSV backup</span>
              </span>
              <span style={{ color: C.slate, fontSize: 18 }}>{showImport ? "−" : "+"}</span>
            </button>

            {showImport && (
              <div style={{ marginTop: 12 }}>
                <input type="file" accept=".csv,.tsv,.txt,text/csv" style={{ fontSize: 12, marginBottom: 10 }}
                  onChange={(e) => {
                    const f = e.target.files && e.target.files[0];
                    if (!f) return;
                    const rd = new FileReader();
                    rd.onload = () => { setImp(String(rd.result || "")); setImpInfo(null); };
                    rd.readAsText(f);

                <textarea rows={4} value={imp} placeholder="…atau tampal kandungan CSV di sini / …or paste CSV content here"
                  onChange={(e) => { setImp(e.target.value); setImpInfo(null); }}
                  style={{ ...inputStyle, fontSize: 11, fontFamily: "ui-monospace, monospace" }} />

                <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                  <Btn size="sm" tone="ghost" disabled={!imp.trim()}
                    onClick={() => setImpInfo(parseBackup(imp))}>Semak / Check</Btn>
                  <Btn size="sm" tone="ink" disabled={!impInfo || !impInfo.rows.length}
                    onClick={async () => {
                      const have = new Set(recs.map((r) => r.id));

                      const ok = await rowsImport(add);
                      await pullRecords();
                      setRows(await rowsLoad());
                      setImp(""); setImpInfo(null); setShowImport(false);
                      setNote(`${add.length} rekod ditambah, ${impInfo.rows.length - add.length} sudah ada. `
                        + `/ ${add.length} added, ${impInfo.rows.length - add.length} already present.`
                        + (ok ? "" : " (Storan tidak tersedia / storage unavailable)"));

                </div>

                {impInfo && (
                  <div style={{ fontSize: 12, color: C.slate, marginTop: 8, lineHeight: 1.5 }}>
                    {impInfo.rows.length} rekod dijumpai
                    {impInfo.skipped ? `, ${impInfo.skipped} baris dilangkau (tajuk atau tidak sah)` : ""}.
                    <div>

                      {impInfo.skipped ? `, ${impInfo.skipped} lines skipped (header or invalid)` : ""}.

                <div style={{ fontSize: 11, color: C.slate, marginTop: 10, lineHeight: 1.5 }}>

          {!sorted.length && <Card><div style={{ fontSize: 13, color: C.slate, lineHeight: 1.5 }}>

          {sorted.map((r) => (

              <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginTop: 8 }}>

          {sorted.length > 0 && (

                Kemas rekod / Tidy records
              </div>
              <div style={{ display: "grid", gap: 8 }}>
                <Btn size="sm" tone="ghost"
                  onClick={() => removeRows((r) => Date.now() - r.ts < 90 * 864e5)}>

                      onClick={() => { removeRows(() => false); setConfirmAll(false); }}>
                      Sahkan padam SEMUA {rows.length} rekod / Confirm deleting ALL
                    </Btn>
                  : <Btn size="sm" tone="ghost" onClick={() => setConfirmAll(true)}>
                      Padam semua rekod / Delete all records

              <div style={{ fontSize: 11, color: C.slate, marginTop: 10, lineHeight: 1.5 }}>
                Muat turun CSV secara berkala — fail itu boleh dipulihkan semula di atas.
                Padam tidak boleh dibatalkan.
                <div>
                  Download the CSV regularly — it can be restored above. Deleting cannot be undone.

        </>

        <>
          <Card>

            <div style={{ fontSize: 11, color: C.slate, marginBottom: 6 }}>School directory</div>

              Direktori dibina daripada pendaftaran murid. Belum ada sekolah.
              <div style={{ fontSize: 12 }}>Built from pupil registrations. No schools yet.</div>
            </div>}
            {dir.names.map((n) => (
              <div key={n} style={{
                display: "flex", justifyContent: "space-between", gap: 10, fontSize: 13,
                padding: "8px 0", borderTop: `1px solid ${C.rule}`,

                <span style={{ color: C.slate, flexShrink: 0 }}>{dir.state.get(n)}</span>
              </div>

              Negeri bercanggah / Conflicting states
            </div>
            {!dir.conflicts.length
              ? <div style={{ fontSize: 12, color: C.slate, lineHeight: 1.5 }}>

            <div style={{ fontSize: 12 }}>
              No suggestions yet. Pupils send them from the 💡 card on the front page.
            </div>

                              alignItems: "center", marginTop: 6 }}>

                      ? (safeUrl(l.url) ? "Pautan sah / valid link" : "Pautan tidak sah / not a valid link")

                  </span>
                  <button onClick={() => setDraft({
                    ...draft, links: draft.links.filter((_, j) => j !== i),

                    background: "none", border: "none", color: C.hibiscus,
                    fontSize: 12, fontWeight: 700, cursor: "pointer",
                  }}>Buang / Remove</button>
                </div>
              </div>
            ))}

            {(draft.links || []).length < 6 && (
              <Btn size="sm" tone="ghost" full onClick={() => setDraft({
                ...draft, links: [...(draft.links || []), { label: "", url: "" }],
              })}>+ Tambah pautan / Add link</Btn>
            )}
            <div style={{ fontSize: 11, color: C.slate, marginTop: 8, lineHeight: 1.5 }}>
              Pautan dibuka dalam tab baharu. Maksimum 6.
              <div>Links open in a new tab. Six maximum.</div>
            </div>
          </div>

          <Field label="Tawaran kelas / Class offer"
            sub="Dipaparkan pada laporan murid. / Shown on the pupil's report.">
            <input style={inputStyle} value={draft.offer}
              onChange={(e) => setDraft({ ...draft, offer: e.target.value })} />
          </Field>
          <div style={{
            fontSize: 11, color: C.slate, marginBottom: 14, lineHeight: 1.5,
            background: "#fffdf8", border: `1px solid ${C.rule}`, borderRadius: 12, padding: 12,
          }}>
            Kata laluan guru diuruskan oleh Firebase Authentication, bukan disimpan di sini.
            Tukar kata laluan melalui konsol Firebase.
            <div>
              The teacher password is managed by Firebase Authentication, not stored here.
              Change it from the Firebase console.
            </div>
          </div>
          <Btn full tone="ink" onClick={saveCfg}>Simpan tetapan / Save settings</Btn>
        </Card>
      )}
    </Shell>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
